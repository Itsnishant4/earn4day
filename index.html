<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn4Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Removed <link href="stylesheet.css" rel="stylesheet"> as styles are now embedded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Using Inter font which is already linked in the previous CV, but if you want Varela Round specifically: -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        /* Base Styles (Mobile-First Considerations - though this is built on an existing desktop-first structure) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Navbar Styles */
        .navbar {
            padding: 1rem 1rem; /* More consistent padding */
            justify-content: space-between; /* Space out items */
            flex-wrap: wrap; /* Allow navbar items to wrap */
        }

        .navbar .d-flex.align-items-center {
            padding-left: 0; /* Adjust initial padding */
        }

        .navbar-brand img {
            height: 40px; /* Slightly smaller logo for better mobile fit */
            transition: height 0.3s ease;
        }

        .navbar-brand p {
            font-size: 1.8rem; /* Adjusted font size for title */
            transition: font-size 0.3s ease;
        }

        .navbar .Home, .navbar .pp {
            font-size: 0.9rem; /* Smaller navigation links */
            padding-left: 0.75rem;
            padding-right: 0.75rem;
            white-space: nowrap; /* Prevent breaking */
        }

        .navbar .btn {
            font-size: 0.9rem; /* Smaller button text */
            padding: 8px 20px; /* Adjusted button padding */
        }

        /* Main Section Styles */
        .main {
            background: linear-gradient(180deg, rgba(2,0,36,1) 0%, rgba(40,30,111,1) 0%, rgba(211,70,158,1) 100%);
            min-height: calc(100vh - 60px); /* Adjust min-height considering navbar height */
            display: flex;
            flex-direction: column; /* Default to column for mobile */
            align-items: center; /* Center items in column layout */
            justify-content: center;
            padding: 2rem 1rem; /* Add some padding */
            text-align: center; /* Center text content */
            overflow: hidden;
        }

        .left {
            width: 95%; /* Make left section take more width on mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-left: 0; /* Remove fixed left margin */
            margin-top: 1.5rem; /* Add some top margin */
            animation: main 0.3s forwards;
        }

        .right {
            width: 95%; /* Make right section take more width on mobile */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2rem; /* Space between text and image */
        }

        .right img {
            width: 80%; /* Adjust image width for mobile */
            max-width: 300px; /* Cap image size */
            height: auto;
        }

        .left p {
            font-size: 2em; /* Smaller font for main text on mobile */
            color: white;
            line-height: 1.2;
        }

        .left span {
            font-size: 1.2em; /* Smaller span text */
            color: rgb(79, 192, 251);
            font-weight: 700;
        }

        .left .none p {
            font-size: 1.1em; /* Smaller description text */
            font-weight: 400;
            opacity: 0.8;
            margin-top: 0.5rem;
        }

        .btn-grad {
            background-image: linear-gradient(to right, #00C9FF 0%, #92FE9D 51%, #00C9FF 100%);
            margin: 1.5rem 0; /* Adjusted margin */
            padding: 12px 30px; /* Adjusted padding */
            text-align: center;
            text-transform: uppercase;
            transition: 0.5s;
            background-size: 200% auto;
            color: black;
            font-weight: 700;
            border-radius: 30px;
            display: block;
            border: none;
            cursor: pointer; /* Indicate it's clickable */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Add subtle shadow to button */
        }

        .btn-grad:hover {
            background-position: right center;
            color: #fff;
            text-decoration: none;
        }

        .down {
            display: flex;
            width: 100%;
            justify-content: center; /* Center these elements */
            margin-top: 1rem;
            flex-wrap: wrap; /* Allow numbers to wrap */
        }

        .down div p {
            color: white;
            font-weight: 700;
            opacity: 1;
            font-size: 1.2em; /* Adjusted font size for numbers */
            margin-bottom: 0.2rem;
        }

        .down div {
            margin: 10px 15px; /* Adjusted margin for spacing */
            min-width: 100px; /* Ensure a minimum width for each block */
        }

        @keyframes main {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Desktop and Tablet Styles (apply above 768px and 1024px respectively) */
        @media only screen and (min-width: 768px) {
            .navbar {
                padding: 1rem 2rem;
            }

            .navbar-brand img {
                height: 45px;
            }

            .navbar-brand p {
                font-size: 2.2rem;
            }

            .navbar .Home, .navbar .pp {
                font-size: 1rem;
            }

            .navbar .btn {
                font-size: 1rem;
                padding: 10px 25px;
            }

            .main {
                flex-direction: row; /* Change to row layout for larger screens */
                min-height: 90vh; /* Adjust min-height back for desktop */
                text-align: left; /* Align text to left in row layout */
            }

            .left {
                width: 55%; /* More width for text content */
                margin-left: 6vw; /* Restore original left margin */
                align-items: flex-start; /* Align text to start */
                margin-top: 0;
            }

            .right {
                width: 45%; /* Less width for image */
                margin-top: 0;
            }

            .right img {
                width: 90%; /* Original image width */
                max-width: none; /* Remove max-width constraint */
            }

            .left p {
                font-size: 3em; /* Restore original large font size */
            }

            .left span {
                font-size: 1.4em; /* Restore original span font size */
            }

            .left .none {
                display: block; /* Show the descriptive text on larger screens */
            }

            .left .none p {
                font-size: 1.5em; /* Restore original description font size */
            }

            .down {
                justify-content: flex-start; /* Align numbers to start */
                margin-top: 10px;
            }
        }

        @media only screen and (min-width: 1024px) {
            .navbar {
                padding: 1rem 5vw; /* Match original padding for larger screens */
            }

            .navbar-brand img {
                height: 50px;
            }

            .navbar-brand p {
                font-size: 3rem;
            }

            .navbar .Home, .navbar .pp {
                padding-left: 1.5rem; /* Restore original padding */
                padding-right: 1.5rem;
                font-size: 1rem;
            }

            .navbar .btn {
                font-size: 1rem;
                padding: 15px 45px;
            }
        }

        /* Specific styles for small mobile screens (e.g., less than 480px) */
        @media only screen and (max-width: 480px) {
            body {
                padding: 1rem;
            }
            .navbar .d-flex.align-items-center {
                flex-grow: 1; /* Allow logo and title to grow */
                justify-content: center;
            }
            .navbar .d-flex.align-items-center:last-child {
                flex-basis: 100%; /* Force nav links/button to new line */
                justify-content: center;
                margin-top: 1rem;
            }
            .left p {
                font-size: 1.8em; /* Even smaller font for very small screens */
            }
            .left span {
                font-size: 1.1em;
            }
            .left .none p {
                font-size: 1em;
            }
            .btn-grad {
                padding: 10px 25px;
            }
            .down div {
                margin: 5px 10px;
            }
            .down div p {
                font-size: 1.1em;
            }
        }
    </style>
</head>

            </div>

            <div class="down">

                </div>

                <div>

            </div>

        </div>
        <div class="right">
            <img src="https://firebasestorage.googleapis.com/v0/b/ganesha-9f5a9.appspot.com/o/uploads%2F1753363454591_min.png?alt=media&token=ac8966bf-e845-4e61-b2f7-346ca866ffdf" alt="">

    </div>

</html>
